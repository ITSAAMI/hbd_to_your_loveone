<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Happy Birthday, My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="scene">
        <div class="stars"></div>
        <div class="container">
            <h1 class="title">Happy Birthday, My Love</h1>
            <p class="subtitle" id="typed"></p>

            <div class="card" id="card">
                <p class="message" id="message">You are my sunshine, my heart, my everything. Wishing you the happiest
                    birthday filled with love.</p>
                <div class="controls">
                    <button id="revealBtn" class="btn">Open Surprise</button>
                    <button id="playBtn" class="btn ghost">Play Song</button>
                </div>
            </div>

            <div class="hearts" id="hearts"></div>
        </div>
    </div>

    <audio id="song" src="song.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>

</html>
